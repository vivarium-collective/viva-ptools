[project]
name = "pbg-ptools"
version = "0.1.0"
description = "Pathway Tools (EcoCyc) Omics-Viewer launcher — a vivarium-workbench analysis-viewer plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # This package IS a vivarium-workbench plugin: it contributes a viewer via
    # the workbench's `workbench_viewers.get_viewers` discovery seam and imports
    # the workbench's canonical path resolvers (study_spec.study_dir,
    # workspace_paths.WorkspacePaths). Leaf → host is the intended direction; the
    # workbench never depends back on this package (it discovers it by the
    # `pbg-*` distribution scan at runtime).
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.uv.sources]
# Local checkout during development; a published/git source replaces this in CI.
vivarium-workbench = { path = "../vivarium-workbench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_ptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
